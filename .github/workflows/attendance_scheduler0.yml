name: Mahalla Attendance Bot

on:
  schedule:
    # Dushanbadan jumaga qadar Toshkent vaqti bilan soat 09:00 da (UTC bo'yicha 04:00 da) ishlaydi
    - cron: '0 4 * * 1-5'
  workflow_dispatch:

jobs:
  run-attendance-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Repozitariyni yuklab olish
        uses: actions/checkout@v3

      - name: Python muhitini o'rnatish
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Kutubxonalarni o'rnatish
        run: |
          python -m pip install --upgrade pip
          pip install selenium requests

      - name: Google Chrome o'rnatish
        uses: browser-actions/setup-chrome@latest

      - name: Python skriptini ishga tushirish
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        run: |
          python attendance.py
