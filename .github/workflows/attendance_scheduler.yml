name: Mahalla Attendance Bot

on:
  schedule:
    - cron: '0 4 * * *'  # Har kuni ertalab soat 04:00 da (UTC) ishlaydi
  workflow_dispatch:     # Qo'lda "Run workflow" bosib tekshirish uchun

jobs:
  run-attendance-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Repozitariyni yuklab olish
        uses: actions/checkout@v3

      - name: Python muhitini o'rnatish
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Kutubxonalarni o'rnatish
        run: |
          python -m pip install --upgrade pip
          pip install selenium requests

      - name: Google Chrome o'rnatish
        uses: browser-actions/setup-chrome@latest

      - name: Python skriptini ishga tushirish
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          python attendance.py
