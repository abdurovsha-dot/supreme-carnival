name: Mahalla Attendance Bot

on:
  schedule:
    # Har kuni soat ertalab 09:00 da ishga tushadi (UTC vaqt bo'yicha, o'zingizga moslang)
    - cron: '0 4 * * *'
  workflow_dispatch: # Qo'lda ham "Run workflow" tugmasini bosib ishga tushirish mumkin

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Repozitariyni yuklab olish
        uses: actions/checkout@v3

      - name: Python muhitini o'rnatish
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Kerakli kutubxonalarni o'rnatish
        run: |
          python -m pip install --upgrade pip
          pip install selenium requests

      - name: Google Chrome va ChromeDriver o'rnatish
        uses: browser-actions/setup-chrome@latest

      - name: Python skriptini ishga tushirish
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          python main.py
